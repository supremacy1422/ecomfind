<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Gradient for the icon background -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient for lightning -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background (transparent by default, but we add a dark rect for preview) -->
  <rect x="0" y="0" width="800" height="300" fill="#0b0f1f" rx="0"/>

  <!-- Icon Group -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Outer shield/hexagon shape -->
    <path d="M 100 10 L 180 50 L 180 130 L 100 170 L 20 130 L 20 50 Z" 
          fill="url(#iconGrad)" 
          stroke="#fbbf24" 
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Inner accent line -->
    <path d="M 100 25 L 165 58 L 165 122 L 100 155 L 35 122 L 35 58 Z" 
          fill="none" 
          stroke="#f59e0b" 
          stroke-width="1.5"
          stroke-opacity="0.4"
          stroke-linejoin="round"/>

    <!-- Magnifying glass circle -->
    <circle cx="85" cy="85" r="35" 
            fill="none" 
            stroke="#e2e8f0" 
            stroke-width="5"
            stroke-linecap="round"/>

    <!-- Magnifying glass handle -->
    <line x1="112" y1="112" x2="145" y2="145" 
          stroke="#e2e8f0" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Lightning bolt inside - representing power -->
    <path d="M 78 55 L 92 55 L 84 78 L 98 78 L 72 115 L 80 88 L 66 88 Z" 
          fill="url(#goldGrad)"
          filter="url(#glow)"/>

    <!-- Small sparkle accents -->
    <circle cx="55" cy="55" r="2.5" fill="#fbbf24" opacity="0.9"/>
    <circle cx="125" cy="65" r="2" fill="#fbbf24" opacity="0.7"/>
    <circle cx="60" cy="125" r="2" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Text: EcomFind -->
  <g transform="translate(280, 105)">
    <!-- Ecom -->
    <text x="0" y="70" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="72" 
          font-weight="900" 
          fill="#f8fafc"
          letter-spacing="-2"
          filter="url(#shadow)">Ecom</text>

    <!-- Find - in gold -->
    <text x="205" y="70" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="72" 
          font-weight="900" 
          fill="url(#goldGrad)"
          letter-spacing="-2"
          filter="url(#shadow)">Find</text>

    <!-- Tagline -->
    <text x="5" y="115" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="18" 
          font-weight="600" 
          fill="#94a3b8"
          letter-spacing="6"
          text-transform="uppercase">DISCOVER. CONNECT. CONVERT.</text>

    <!-- Underline accent -->
    <line x1="5" y1="130" x2="320" y2="130" 
          stroke="#f59e0b" 
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>

  <!-- Corner power accents -->
  <g opacity="0.15">
    <path d="M 750 20 L 780 20 L 780 50" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M 50 280 L 20 280 L 20 250" fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>
</svg>